<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Ponto - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>⏰ Calculadora de Ponto</h1>
            
            <div class="dashboard-container">
                <h2>Selecione o tipo de ponto:</h2>
                
                <div class="opcoes-grid">
                    <a href="ponto-fixo.html" class="opcao-card">
                        <div class="opcao-icon">📌</div>
                        <div class="opcao-titulo">Ponto Fixo</div>
                        <div class="opcao-descricao">Horários pré-definidos</div>
                    </a>
                    
                    <a href="ponto-flexivel.html" class="opcao-card">
                        <div class="opcao-icon">🔄</div>
                        <div class="opcao-titulo">Ponto Flexível</div>
                        <div class="opcao-descricao">Defina seus horários</div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <style>
        .dashboard-container {
            padding: 20px;
            background: white;
            text-align: center;
        }

        .dashboard-container h2 {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 1.2rem;
        }

        .opcoes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .opcao-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: #f5f5f5;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .opcao-card:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(125, 11, 57, 0.2);
        }

        .opcao-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .opcao-titulo {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .opcao-descricao {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .opcao-card:hover .opcao-descricao {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .opcoes-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>
</html>
