<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Fixo - Seleção de Jornada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📌 Ponto Fixo</h1>
            
            <div class="dashboard-container">
                <h2>Selecione a jornada:</h2>
                
                <div class="jornadas-grid">
                    <a href="ponto-fixo-0848.html" class="jornada-card">
                        <div class="jornada-tempo">08:48</div>
                        <div class="jornada-descricao">Jornada completa</div>
                    </a>
                    
                    <a href="ponto-fixo-0800.html" class="jornada-card">
                        <div class="jornada-tempo">08:00</div>
                        <div class="jornada-descricao">Jornada reduzida</div>
                    </a>
                    
                    <a href="ponto-fixo-0600.html" class="jornada-card">
                        <div class="jornada-tempo">06:00</div>
                        <div class="jornada-descricao">Meio período</div>
                    </a>
                    
                    <a href="ponto-fixo-0400.html" class="jornada-card">
                        <div class="jornada-tempo">04:00</div>
                        <div class="jornada-descricao">Jornada parcial</div>
                    </a>
                </div>

                <a href="index.html" class="btn btn-back" style="margin-top: 20px;">← Voltar</a>
            </div>
        </div>
    </div>

    <style>
        .dashboard-container {
            padding: 20px;
            background: white;
            text-align: center;
        }

        .dashboard-container h2 {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 1.2rem;
        }

        .jornadas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .jornada-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            background: #f5f5f5;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .jornada-card:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(125, 11, 57, 0.2);
        }

        .jornada-tempo {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .jornada-descricao {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .jornada-card:hover .jornada-descricao {
            opacity: 1;
        }

        .btn-back {
            background: #666;
            display: inline-block;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn-back:hover {
            background: #555;
        }

        @media (max-width: 768px) {
            .jornadas-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>
</html>
